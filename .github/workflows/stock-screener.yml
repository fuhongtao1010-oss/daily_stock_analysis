name: 智能选股推荐

on:
  schedule:
    - cron: '0 22 * * 1-5'  # 工作日 06:00 北京时间 (UTC+8)
  workflow_dispatch:

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install requests pandas numpy

      - name: 运行全市场扫描选股
        run: |
          python scripts/stock_screener.py

      - name: 发送 Telegram 推送
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message_file: stock_recommend_report.md
          format: markdown

      - name: 上传选股结果
        uses: actions/upload-artifact@v4
        with:
          name: stock-recommend
          path: |
            stock_recommend_report.md
            stock_recommend_top10.json
